nameOverride: ""

kind: Deployment
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

command: []
args: []

env: {}
envFrom: []

ports: []
service:
  enabled: true
  type: ClusterIP

probes:
  liveness: {}
  readiness: {}
  startup: {}

resources: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30
strategy: {}
nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

volumes: []
volumeMounts: []

networkPolicy:
  enabled: false
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []

migrate:
  enabled: false
  command: []
  backoffLimit: 0
  activeDeadlineSeconds: 900
  resources: {}
